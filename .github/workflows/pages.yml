# Publishes daily to GitHub Pages as a read-only snapshot with real content.
#
# GitHub Pages only serves static files, so this job runs the real backend
# pipeline here — adopt the source pack plus site/sources.txt, poll
# every source, fetch articles and write AI summaries — then freezes every read
# endpoint to JSON (backend app/static_site.py) and exports the frontend in
# static-data mode on top of it. The SQLite database is kept between runs in the
# Actions cache, so items accumulate and each run only fetches what is new.
#
# One-time setup:
#   Settings → Pages → Build and deployment → Source: GitHub Actions
#   Settings → Secrets and variables → Actions → New repository secret:
#     DEEPSEEK_API_KEY (optional — without it items appear with placeholder summaries)
name: Deploy daily to GitHub Pages

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 */6 * * *" # every 6 hours
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false # never drop a run midway: it owns the cached database

env:
  SITE_DATA: ${{ github.workspace }}/site-data

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - name: Install backend
        run: pip install -e backend

      - name: Restore database
        uses: actions/cache/restore@v4
        with:
          path: site-data
          key: daily-db-${{ github.run_id }}
          restore-keys: daily-db-

      - name: Poll sources, summarize, export snapshot
        working-directory: backend
        env:
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          DATA_DIR: ${{ env.SITE_DATA }}
          SQLITE_PATH: ${{ env.SITE_DATA }}/daily.db
        run: |
          mkdir -p "$SITE_DATA"
          python -m app.static_site \
            --out ../frontend/public/data \
            --sources ../site/sources.txt \
            --minutes 20

      - name: Save database
        if: always()
        uses: actions/cache/save@v4
        with:
          path: site-data
          key: daily-db-${{ github.run_id }}

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Static export under /<repo>
        working-directory: frontend
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}
          NEXT_PUBLIC_REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          npm ci
          npm run build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
